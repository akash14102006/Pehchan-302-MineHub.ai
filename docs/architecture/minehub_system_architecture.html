<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MineHub.ai — System Architecture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 30px;
    }
    .canvas-container {
      background: #ffffff;
      width: 1200px;
      height: 675px;
      border-radius: 20px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.07), 0 0 1px 1px rgba(0, 0, 0, 0.05);
      position: relative;
      overflow: hidden;
    }
    .title-bar {
      position: absolute;
      top: 36px;
      left: 50px;
      font-size: 26px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.5px;
    }
    /* Top Ingestion Container */
    .ingestion-box {
      position: absolute;
      top: 90px;
      left: 50px;
      width: 720px;
      height: 220px;
      border: 1.5px solid #cbd5e1;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
      padding: 24px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .box-tag {
      position: absolute;
      top: 14px;
      right: 22px;
      font-size: 13px;
      font-weight: 700;
      color: #475569;
      letter-spacing: 0.5px;
    }
    .node {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .node:hover {
      transform: translateY(-3px);
    }
    .node-label {
      margin-top: 10px;
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
    }
    .arrow-icon {
      font-size: 26px;
      font-weight: 800;
      color: #0f172a;
      user-select: none;
    }
    /* Badges */
    .circle-badge {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #00acc1, #00838f);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0, 131, 143, 0.25);
    }
    .success-badge {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #00bcd4, #00838f);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 28px rgba(0, 131, 143, 0.3);
    }
    /* SVG Connectors */
    .flow-lines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    /* Process Labels */
    .process-label {
      position: absolute;
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
      background: #ffffff;
      padding: 2px 6px;
    }
  </style>
</head>
<body>
  <div class="canvas-container">
    <div class="title-bar">MINEHUB.AI — SYSTEM ARCHITECTURE</div>

    <!-- Master Diagram Image View with 100% Crisp Scaling -->
    <img src="minehub_system_architecture.jpg" alt="MineHub.ai System Architecture" style="width: 100%; height: 100%; object-fit: contain; display: block;" />
  </div>

  <div style="margin-top: 20px; font-size: 14px; color: #64748b; font-weight: 600;">
    Direct Project Asset: <code>Downloads/MineHub/Assets/minehub_system_architecture.jpg</code>
  </div>
</body>
</html>
