  <path d="M16,52 Q50,60 84,52" stroke="#D0E8F0" stroke-width="2" fill="none" opacity="0.6" />
  <path d="M22,64 Q50,72 78,64" stroke="#D0E8F0" stroke-width="1.8" fill="none" opacity="0.5" />
